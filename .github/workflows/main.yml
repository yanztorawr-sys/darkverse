name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - run: flutter pub get
        working-directory: ./darkverse

      - run: flutter build apk --release
        working-directory: ./darkverse

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: darkverse/build/app/outputs/flutter-apk/app-release.apk
